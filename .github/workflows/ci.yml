# Unit tests and Android Lint on every pull request into main and every push to main.
# "Tests and lint" is a required status check in the "Protect main" ruleset.
# This workflow never builds a release APK and never publishes anything: releases are cut locally with
# tools/release.py, signed with a key that never leaves the owner's machine.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Branch names are type/short-description (CLAUDE.md rule 2). A personal repository cannot enforce
      # this with a ruleset, so the required check does: a badly named branch cannot be merged.
      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^(fix|chore|feature|docs)/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::Branch \"$BRANCH\" must be fix/, chore/, feature/ or docs/ followed by lowercase words joined by dashes, e.g. feature/places-cards. Rename the branch and open a new pull request."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # compileSdk is 37.1, which the runner image may not ship.
      - name: Install Android platform 37.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null

      - name: Unit tests
        run: bash ./gradlew :core:model:test :core:data:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint
        run: bash ./gradlew lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
