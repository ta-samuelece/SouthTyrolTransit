[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
room = "2.8.5"
# Material 3 Expressive APIs (MaterialExpressiveTheme, ButtonGroup, LoadingIndicator, ...) are only in the 1.5 alpha line.
material3 = "1.5.0-alpha29"
# Pinned to the Compose version material3 1.5.0-alpha29 is built against.
compose = "1.13.0-alpha01"
adaptive = "1.3.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
aboutLibraries = "15.2.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
aboutLibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }

[libraries]
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
material-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
core-ktx = { module = "androidx.core:core-ktx", version = "1.19.1" }
splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidx-hilt" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.12.0" }
glance = { module = "androidx.glance:glance-appwidget", version = "1.2.0" }
glance-material3 = { module = "androidx.glance:glance-material3", version = "1.2.0" }
work-testing = { module = "androidx.work:work-testing", version = "2.12.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
gtfs = { module = "org.mobilitydata:gtfs-realtime-bindings", version = "0.2.0" }
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version = "13.6.1" }
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
android-test = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-core = { module = "androidx.test:core-ktx", version = "1.7.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
